# Recording settings: cameras, servo gain, rate. Used by `so101-record`, and the same values must be used at
# evaluation (docs/PROTOCOL.md: "camera settings and servo gain as in the demonstrations").
# Device paths come from so101-core's git-ignored config/devices.yaml (SO101_CONFIG_DIR).
#
# Status: S2 draft. The ZED crop, the output sizes, the white balance and the gain are fixed after the
# workspace is rebuilt and recorded in DECISIONS.md before the first demonstration.

fps: 30
# Encode video while recording, so saving an episode takes ~no time (otherwise the follower stands still
# for the whole AV1 encode after each reset phase).
streaming_encoding: true

follower:
  # LeRobot's default; also for evaluation (DECISIONS 2026-11-09). M2 ran at 32.
  p_gain: 16
  # LeRobot caps each commanded step (degrees) relative to the present position. Normal teleoperation at
  # 30 Hz stays far below this; it limits the jump if the leader starts far from the follower.
  max_relative_target: 10.0

# Scene (not read by code; the protocol requires the same scene for demonstrations and evaluation).
# Check the light's display before each session: it may not keep its settings when switched off.
scene:
  light: Ulanzi UA12 LED tube, magnetic mount at the centre of the box
  light_brightness_pct: 10
  light_colour: daylight preset   # the light's own preset; use the same preset every session
  light_power: null           # to fill in: battery or USB-C (USB-C recommended for long sessions)

cameras:
  zed:
    # ZED 2 over UVC, FHD per eye: 3840x1080 side by side, YUYV only. Left eye, then crop and resize.
    capture: [3840, 1080]
    fourcc: YUYV
    # Crop away the dark strip outside the box on the left; the folded arm reaches x ~260, and the gripper
    # rises to the top of the view above the bowl, so the full height stays (PROTOCOL section 7).
    crop: [240, 0, 1680, 1080]  # [x, y, w, h] in left-eye pixels
    out_size: [840, 540]
    v4l2:
      power_line_frequency: 2   # 60 Hz mains (the factory default is 50 Hz: banding under US lighting)
  wrist:
    capture: [1280, 720]  # M2's wrist intrinsics are at 1280x720
    fourcc: MJPG
    # No resize here (LeRobot's OpenCV camera cannot); the policy resizes at training time.
    v4l2:
      power_line_frequency: 2
      exposure_dynamic_framerate: 0  # otherwise the camera drops below 30 fps in dim light

# Evaluation (PROTOCOL section 7). Read by so101-eval.
eval:
  # Tape roll centre, base frame, mm: x = origin + u * u_axis + v * v_axis.
  region: {origin: [190, -110], u_axis: [140, 0], v_axis: [0, 150]}
  bowl_centre_mm: [250, 170]
  use_yaw: true           # the ring box: yaw in [0, 90) matters (PROTOCOL amendment 2)
  # The folded rest pose clipped to SafeArm's limits (LeRobot degrees; gripper %): DECISIONS 2026-11-09.
  start_pose_deg: [8.6, -95.0, 91.8, 76.0, -92.5, 4.5]
  time_limit_s: 70        # 3 x the median dry-run duration (23.0 s), rounded up to 5 s (PROTOCOL section 7)

# Policy runs on the arm (so101-rollout, so101-eval): SafeArm's step cap per 30 Hz tick (DECISIONS 2026-11-09).
rollout:
  max_step_deg: 4.0   # 120 deg/s: above the demonstrations' peak joint speeds (~110 deg/s)
