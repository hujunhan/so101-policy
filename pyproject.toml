[project]
name = "so101-policy"
version = "0.1.0"
description = "SO-101 learned policies: one manipulation task, teleoperated demonstrations, ACT and SmolVLA, a pre-registered evaluation"
readme = "README.md"
license = "MIT"
authors = [{ name = "Junhan Hu" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "so101-core @ git+https://github.com/hujunhan/so101-core@534b1e91f488768ea92d1f92bbf6cc3459d00bb7",
    # M2: camera poses (results/s4/handeye.yaml), ray-plane, the ZED's factory intrinsics
    "so101-calib @ git+https://github.com/hujunhan/so101-calib@c5b2ccdd115f3b8dcdf8bc71d618d368b6fcd758",
]

[project.optional-dependencies]
hw = ["so101-core[hw] @ git+https://github.com/hujunhan/so101-core@534b1e91f488768ea92d1f92bbf6cc3459d00bb7"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/so101_policy"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
