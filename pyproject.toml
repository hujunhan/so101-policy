[project]
name = "so101-policy"
version = "0.1.0"
description = "SO-101 learned policies: one manipulation task, teleoperated demonstrations, ACT and SmolVLA, a pre-registered evaluation"
readme = "README.md"
license = "MIT"
authors = [{ name = "Junhan Hu" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "so101-core @ git+https://github.com/hujunhan/so101-core@534b1e91f488768ea92d1f92bbf6cc3459d00bb7",
    # M2: camera poses (results/s4/handeye.yaml), ray-plane, the ZED's factory intrinsics
    "so101-calib @ git+https://github.com/hujunhan/so101-calib@57f1add31c3c7f740f77457b65f1b0fc9d31f50f",
]

[project.optional-dependencies]
hw = [
    "so101-core[hw] @ git+https://github.com/hujunhan/so101-core@534b1e91f488768ea92d1f92bbf6cc3459d00bb7",
    # Recording extras (datasets, video encoding, rerun display). The commit must match so101-core's pin.
    "lerobot[dataset,viz] @ git+https://github.com/huggingface/lerobot@f5c9bc02137c331b009eccd44ece6f11b62187a8",
]

[project.scripts]
so101-record = "so101_policy.record:main"
so101-check-dataset = "so101_policy.check_dataset:main"
so101-replay = "so101_policy.replay:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/so101_policy"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
